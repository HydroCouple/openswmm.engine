name: Unit Testing

permissions:
  contents: read

on:
  push:
    branches: [main, develop, swmm6_rel]
  pull_request:
    branches: [main, develop, swmm6_rel]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # Note: the vcpkg `tests` feature is enabled via -DVCPKG_MANIFEST_FEATURES on
  # the Configure step below; the env-var form isn't honored by the vcpkg
  # toolchain at CMake configure time.
  OMP_NUM_THREADS: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────
  #  C / C++ Engine — build, unit test, and package
  # ──────────────────────────────────────────────────────────────────────
  engine:
    name: "C++ Engine (${{ matrix.alias }})"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            alias: Linux-x64
            cmake_preset: Linux
            shell_ext: .sh
            vcpkg_triplet: x64-linux
            cmake_osx_arch: ""

          - os: macos-latest
            alias: macOS-arm64
            cmake_preset: Darwin
            shell_ext: .sh
            vcpkg_triplet: arm64-osx
            cmake_osx_arch: arm64

          - os: macos-15-intel
            alias: macOS-x64
            cmake_preset: Darwin
            shell_ext: .sh
            vcpkg_triplet: x64-osx
            cmake_osx_arch: x86_64

          - os: windows-latest
            alias: Windows-x64
            cmake_preset: Windows
            shell_ext: .bat
            vcpkg_triplet: x64-windows
            cmake_osx_arch: ""

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: 2026.07.29
          path: vcpkg

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          .\bootstrap-vcpkg${{ matrix.shell_ext }}
          .\vcpkg.exe integrate install

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          ./bootstrap-vcpkg${{ matrix.shell_ext }}
          chmod +x vcpkg

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg downloads (source tarballs)
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-
            vcpkg-downloads-${{ runner.os }}-

      # The Windows presets use the Ninja Multi-Config generator (version-
      # agnostic, unlike a pinned "Visual Studio 17 2022" that breaks when the
      # runner's VS major changes). Ninja needs cl.exe/link.exe on PATH, which
      # the VS generator used to supply implicitly — set up the MSVC dev
      # environment so subsequent steps can find the compiler.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Re-pin VCPKG_ROOT (Windows)
        # vcvars64 (VS 2022 17.6+) exports VCPKG_ROOT pointing at Visual
        # Studio's bundled vcpkg, and msvc-dev-cmd forwards it to every later
        # step, overriding the job-level env — so configure would silently
        # build against VS's port snapshot instead of the pinned checkout.
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV

      # gpu;hypre are vcpkg default-features and the plugin/hypre CMake options
      # default ON, but request them EXPLICITLY so the Kokkos `tests/gpu` parity
      # tests and the BoomerAMG path are always built+exercised here even if an
      # upstream default flips (find_package(Kokkos/HYPRE REQUIRED) → configure
      # fails loudly rather than silently dropping Kokkos/AMG).
      - name: Configure
        run: >
          cmake
          --preset=${{ matrix.cmake_preset }}-debug
          -B build-${{ matrix.vcpkg_triplet }}
          -DVCPKG_MANIFEST_FEATURES="tests;geopackage;gpu;hypre"
          -DOPENSWMM_BUILD_TESTS=OFF
          -DOPENSWMM_BUILD_UNIT_TESTS=ON
          -DOPENSWMM_BUILD_GPU_PLUGIN=ON
          -DOPENSWMM_GPU_BACKEND=omp
          -DOPENSWMM_WITH_HYPRE=ON
          -DOPENSWMM_WITH_GEOPACKAGE=ON
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_osx_arch }}

      - name: Build
        run: cmake --build build-${{ matrix.vcpkg_triplet }} --config Debug

      - name: Unit tests
        # Stream Windows cases so a canceled run identifies the last active test.
        run: ctest --test-dir build-${{ matrix.vcpkg_triplet }} -C Debug -L unit --output-on-failure ${{ runner.os == 'Windows' && '--verbose' || '' }}

      - name: Diagnose Linux unit-test segfaults (gdb)
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get install -y gdb
          python3 .github/scripts/debug_failed_tests.py "build-${{ matrix.vcpkg_triplet }}" gdb

      - name: Diagnose macOS unit-test segfaults (lldb)
        if: failure() && runner.os == 'macOS'
        run: python3 .github/scripts/debug_failed_tests.py "build-${{ matrix.vcpkg_triplet }}" lldb

      - name: Dump failed vcpkg build logs (Windows)
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          # The Windows failure is during `cmake configure`, when vcpkg builds a
          # dependency (e.g. Kokkos). vcpkg prints "See logs for more
          # information: <path>" but CI never echoes those files, so the real
          # compiler error is invisible. Dump every per-package out/err log so
          # the actual error shows up in the job output.
          BT="${{ github.workspace }}/vcpkg/buildtrees"
          if [ ! -d "$BT" ]; then echo "No vcpkg buildtrees at $BT"; exit 0; fi
          # Dump the per-package build logs for the deps most likely to fail
          # here (Kokkos is the current culprit; sundials/hdf5 pull it in).
          # Falls back to every *.log if none of those dirs exist.
          dirs=""
          for d in kokkos sundials hdf5; do
            [ -d "$BT/$d" ] && dirs="$dirs $BT/$d"
          done
          [ -z "$dirs" ] && dirs="$BT"
          find $dirs -type f -name '*.log' 2>/dev/null | while read -r f; do
            echo "==================================================="
            echo "==== vcpkg log: $f"
            echo "==================================================="
            tail -200 "$f" || true
          done

      - name: Package
        run: cmake --build build-${{ matrix.vcpkg_triplet }} --target package

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: engine-${{ matrix.vcpkg_triplet }}
          path: |
            build-${{ matrix.vcpkg_triplet }}/*.tar.gz
            build-${{ matrix.vcpkg_triplet }}/*.zip

      # ── Release build for Python wheel consumption ────────────────────────
      # vcpkg packages are already in the binary cache from the Debug build
      # above, so this configure is fast (no SUNDIALS recompilation).
      - name: Configure (Release, for Python wheel)
        run: >
          cmake
          --preset=${{ matrix.cmake_preset }}
          -B build-${{ matrix.vcpkg_triplet }}-release
          -DVCPKG_MANIFEST_FEATURES="geopackage;gpu;hypre"
          -DOPENSWMM_BUILD_TESTS=OFF
          -DOPENSWMM_BUILD_UNIT_TESTS=OFF
          -DOPENSWMM_BUILD_REGRESSION_TESTS=OFF
          -DOPENSWMM_BUILD_BENCHMARKS=OFF
          -DOPENSWMM_BUILD_GPU_PLUGIN=ON
          -DOPENSWMM_GPU_BACKEND=omp
          -DOPENSWMM_WITH_HYPRE=ON
          -DOPENSWMM_WITH_GEOPACKAGE=ON
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_osx_arch }}

      - name: Build (Release, for Python wheel)
        run: cmake --build build-${{ matrix.vcpkg_triplet }}-release --config Release

      - name: Install (Release, for Python wheel)
        run: >
          cmake --install build-${{ matrix.vcpkg_triplet }}-release
          --config Release
          --prefix "${{ github.workspace }}/engine-install-${{ matrix.vcpkg_triplet }}"

      - name: Verify bundled runtime libs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          INST="${{ github.workspace }}/engine-install-${{ matrix.vcpkg_triplet }}"
          cd "$INST/bin"
          echo "--- bin/ contents ---"
          ls -la
          echo
          for exe in openswmm openswmm-legacy; do
            [ -x "$exe" ] || continue
            echo "--- $exe linkage ---"
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              otool -L "$exe"
            else
              ldd "$exe"
            fi
          done
          # Gate: the Kokkos-OpenMP plugin must be installed (lib/ on Unix).
          PLUGIN=$(find "$INST/lib" \( -name 'libopenswmm_gpu_omp.dylib' -o -name 'libopenswmm_gpu_omp.so' \) | head -1 || true)
          if [ -z "$PLUGIN" ]; then
            echo "::error::Kokkos GPU plugin (libopenswmm_gpu_omp) missing from $INST/lib — Kokkos default regressed"
            exit 1
          fi
          echo "Kokkos plugin installed: $PLUGIN"

      - name: Verify bundled runtime libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $inst = "${{ github.workspace }}/engine-install-${{ matrix.vcpkg_triplet }}"
          Set-Location "$inst/bin"
          Write-Host "--- bin/ contents ---"
          Get-ChildItem | Format-Table Mode,Length,Name
          # Gate: the Kokkos-OpenMP plugin must be installed (bin/ on Windows).
          $plugin = Get-ChildItem -Recurse -Path $inst -Filter "openswmm_gpu_omp.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $plugin) {
            Write-Host "::error::Kokkos GPU plugin (openswmm_gpu_omp.dll) missing from $inst — Kokkos default regressed"
            exit 1
          }
          Write-Host "Kokkos plugin installed: $($plugin.FullName)"

      - name: Upload engine install artifact
        uses: actions/upload-artifact@v5
        with:
          name: engine-install-${{ matrix.vcpkg_triplet }}
          path: engine-install-${{ matrix.vcpkg_triplet }}/
