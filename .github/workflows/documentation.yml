name: Documentation

permissions:
  contents: read

on:
  push:
#    branches: [main, develop]
    branches: [main, develop, swmm6_rel]
    tags: ["v*.*.*"]
    # src/engine is in the filter because the manual lint checks the manuals
    # against the parser (registered [SECTION]s, error codes): registering a
    # section without documenting it must trip the gate.
    paths: ['docs/**', 'python/docs/**', 'python/openswmm/**', 'include/**', '**/*.md',
            'src/engine/**', 'scripts/lint_manual_docs*.py']
  pull_request:
    branches: [main, develop, swmm6_rel]
    # branches: [main]
    paths: ['docs/**', 'python/docs/**', 'python/openswmm/**', 'include/**', '**/*.md',
            'src/engine/**', 'scripts/lint_manual_docs*.py']
  workflow_dispatch:

# Allow only one concurrent deployment.  Do NOT cancel in-progress runs so
# that production deployments always complete.
concurrency:
  group: pages
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# Job 0 – Lint the manual sources
#   Referential integrity, tables, math delimiters, images, [SECTION] and
#   error-code coverage, status badges, Mermaid blocks. Runs the negative
#   suite too, so a check that silently stopped failing is caught here.
#   Doxygen runs with WARN_AS_ERROR = NO (header warnings would drown it), so
#   this job is what actually fails the build on a broken manual.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint_manual_docs:
    name: Lint Manual Sources
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Lint the manuals
        run: python3 scripts/lint_manual_docs.py

      - name: Prove every lint check can fail
        run: python3 scripts/lint_manual_docs_negative.py

      - name: Upload negative-test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: docs-lint-negative
          path: tests/output/docs_lint_negative_*/*.log
          if-no-files-found: ignore
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 – Build Python (Sphinx) documentation
# ─────────────────────────────────────────────────────────────────────────────
  build_python_docs:
    name: Build Python Bindings Docs (Sphinx)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sphinx and theme dependencies
        # Install from requirements.txt (single source of truth — keeps
        # CI in lockstep with the doc-author's local environment, including
        # sphinx-design for the grid/tab-set directives in the User Guide
        # and Migration pages).
        run: |
          pip install -r python/docs/requirements.txt
          pip install numpy

      - name: Build Sphinx HTML docs
        # conf.py adds python/ to sys.path and installs the Cython stub-file
        # finder, so no compiled extensions or package installation is needed.
        # -W promotes warnings to errors so a regression in the docs blocks
        # the build; --keep-going still surfaces every issue in one pass.
        run: |
          sphinx-build -b html -W --keep-going python/docs python/docs/_build/html

      - name: Upload Python docs artifact
        uses: actions/upload-artifact@v5
        with:
          name: python-docs
          path: python/docs/_build/html/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 – Build C/C++ documentation (Doxygen)
#   Runs after the Python docs build per the documented deployment order.
# ─────────────────────────────────────────────────────────────────────────────
  build_doxygen_docs:
    name: Build C/C++ Engine Docs (Doxygen)
    needs: [lint_manual_docs, build_python_docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Graphviz and download tools
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz wget tar

      - name: Install Doxygen 1.13.2
        run: |
          DOXYGEN_VERSION=1.13.2
          # Doxygen release TAGS use underscores (Release_1_13_2) while the
          # asset filename uses dots (doxygen-1.13.2.linux.bin.tar.gz). Building
          # the tag with dots 404s, so derive the underscore form explicitly.
          DOXYGEN_TAG="Release_${DOXYGEN_VERSION//./_}"
          wget -q "https://github.com/doxygen/doxygen/releases/download/${DOXYGEN_TAG}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar -xzf doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz
          sudo mv doxygen-${DOXYGEN_VERSION}/bin/doxygen /usr/local/bin/doxygen
          doxygen --version

      - name: Set up Python 3.12 (figure pipeline)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install figure-pipeline dependencies
        run: pip install "matplotlib>=3.8" numpy

      - name: Prove the synthetic figure generators run
        # The committed PNGs are what gets published and were audited by the
        # lint job (every embed has a manifest row, every row's file exists,
        # bounds, no basename collisions). This renders the synthetic tier into
        # a scratch directory to prove each generator still executes — never a
        # pixel comparison. Generators that need the compiled openswmm package
        # are skipped and listed.
        run: python3 scripts/build_manual_figures.py build --tier synthetic --out /tmp/figcheck --skip-missing-deps

      - name: Check the GUI tagfile for drift (advisory)
        # docs/tags/swmmvis-manual.tag is committed so the build never depends
        # on the GUI Pages site being reachable. This only reports staleness —
        # it must not fail the build, and it skips silently when offline.
        continue-on-error: true
        run: |
          python3 scripts/refresh_gui_tagfile.py --check \
            || echo "::warning::docs/tags/swmmvis-manual.tag is stale; run scripts/refresh_gui_tagfile.py"

      - name: Build Doxygen HTML docs
        # docs/CNAME pins the Pages custom domain. It must sit at the ROOT of
        # the published site, which is the Doxygen output — the Python docs
        # land under /python and would put it one level too deep.
        working-directory: docs
        run: |
          doxygen Doxyfile 2>&1 | tee doxygen.log
          cp CNAME html/

      - name: Fail on manual-scoped Doxygen problems
        # WARN_AS_ERROR stays NO (the C++ headers carry ~1,200 warnings), so
        # the gate is scoped: a missing image/input path, a page label declared
        # twice (which silently re-points every @ref at the wrong page), a
        # dangling @ref into any manual or the GUI tagfile, and a \snippet
        # whose marker pair is broken. Each pattern has been seen to fire.
        working-directory: docs
        run: |
          set -euo pipefail
          fail=0
          for pat in 'does not exist or is not a file' \
                     'multiple use of page label' \
                     "unable to resolve reference to '(application_manual|engine_manual|hydraulics_ref|hydrology_ref|quality_ref|manual_|tutorial_)" \
                     'should appear twice|included file .* is not found'; do
            if grep -E "$pat" doxygen.log; then
              echo "::error::doxygen.log matches '$pat'"
              fail=1
            fi
          done
          exit $fail

      - name: Upload Doxygen docs artifact
        uses: actions/upload-artifact@v5
        with:
          name: doxygen-docs
          path: docs/html/
          retention-days: 1

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 – Merge both doc sets and deploy to GitHub Pages
#   Final site layout:
#     /          → Doxygen C/C++ engine docs (main entry point)
#     /python/   → Sphinx openswmm Python bindings docs
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    # Deploys fire on direct pushes to a whitelisted branch and on manual
    # workflow_dispatch runs targeting one of those same branches. PR events
    # are intentionally excluded — PR builds verify the docs compile but must
    # not overwrite the live Pages site. To preview a PR, push the source
    # branch (swmm6_rel) or dispatch the workflow manually against it from
    # the Actions tab.
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/develop'
          || github.ref == 'refs/heads/swmm6_rel')
    needs: [build_python_docs, build_doxygen_docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Doxygen docs
        uses: actions/download-artifact@v5
        with:
          name: doxygen-docs
          path: site/

      - name: Download Python docs
        uses: actions/download-artifact@v5
        with:
          name: python-docs
          path: site/python/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

