name: Unit Testing Python

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_MANIFEST_FEATURES: "tests"
  OMP_NUM_THREADS: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────
  #  Python bindings — cibuildwheel matrix (one runner per OS/arch).
  #
  #  cibuildwheel's test-command in pyproject.toml runs pytest inside
  #  each built wheel, so the previous "Run Python tests" and
  #  "Run smoke test" steps are no longer needed here.
  #
  #  PR runs build only one CPython version (cp312) per OS for speed.
  #  Pushes to main/develop and manual triggers build the full matrix.
  #  See docs/CIBUILDWHEEL_REVERT_PLAN.md.
  # ──────────────────────────────────────────────────────────────────────
  python:
    name: "Python (${{ matrix.os }})"
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04          # Linux x86_64
          - ubuntu-24.04-arm      # Linux aarch64 (native, no QEMU)
          - windows-2025          # Windows x86_64
          - macos-15              # macOS arm64
          - macos-15-intel        # macOS x86_64
    runs-on: ${{ matrix.os }}
    env:
      # Full matrix on push/dispatch; single CPython on PR for fast feedback.
      CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp312-*' || 'cp310-* cp311-* cp312-* cp313-*' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout vcpkg (host-side, macOS/Windows)
        if: runner.os != 'Linux'
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: 2025.02.14
          path: vcpkg

      - name: Bootstrap vcpkg (macOS)
        if: runner.os == 'macOS'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4
        with:
          package-dir: ./python
          output-dir:  ./wheelhouse
        env:
          # Host-side VCPKG_ROOT consumed by macOS/Windows builds.
          # Linux uses /host/vcpkg inside the container (see pyproject.toml).
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
          # See deployment.yml for rationale — pyproject.toml's
          # [tool.cibuildwheel.macos].environment doesn't reach the
          # x86_64 wheel-tag computation reliably; CIBW_ENVIRONMENT_MACOS does.
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=15.0 VCPKG_ROOT=${{ github.workspace }}/vcpkg

      - name: Upload Python wheels
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: python-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ──────────────────────────────────────────────────────────────────────
  #  Python source distribution (sdist) — platform-independent, built once.
  # ──────────────────────────────────────────────────────────────────────
  sdist:
    name: "Python sdist"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist
        working-directory: python
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v5
        with:
          name: python-sdist
          path: python/dist/*.tar.gz
