# Build and Test — SWMM 5.2.4 (build-v5.2.4)
#
# Rewritten 2026-08-16. The previous workflow was non-functional: it pinned the
# retired `windows-2019` runner, used actions/*@v3, pulled Boost from a personal
# nuget feed (michaeltryby), and depended on an external `ci-tools` repo. It also
# built on Windows only.
#
# This version mirrors openswmm.engine/.github/workflows/regression_testing.yml
# (vcpkg + CMakePresets, 4-platform matrix) so both engine trees build with
# identical `cmake --preset <OS>` invocations. See
# openswmm.engine/plans/ENGINE_524_BUILD_MODERNIZATION_PLAN_2026-08-16.md.

name: Build and Test

permissions:
  contents: read

on:
  push:
    branches: [build-v5.2.4]
  pull_request:
    branches: [build-v5.2.4]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # Deterministic timing and results; the solver otherwise sizes its pool from
  # omp_get_max_threads().
  OMP_NUM_THREADS: 1

jobs:
  build:
    name: "Build (${{ matrix.alias }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            alias: Linux-x64
            cmake_preset: Linux
            shell_ext: .sh
            vcpkg_triplet: x64-linux
            cmake_osx_arch: ""

          - os: windows-latest
            alias: Windows-x64
            cmake_preset: Windows
            shell_ext: .bat
            vcpkg_triplet: x64-windows
            cmake_osx_arch: ""

          - os: macos-latest
            alias: macOS-arm64
            cmake_preset: Darwin
            shell_ext: .sh
            vcpkg_triplet: arm64-osx
            cmake_osx_arch: arm64

          - os: macos-15-intel
            alias: macOS-x64
            cmake_preset: Darwin
            shell_ext: .sh
            vcpkg_triplet: x64-osx
            cmake_osx_arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: 2025.02.14
          path: vcpkg

      - name: Install OpenMP (macOS)
        # AppleClang ships no OpenMP runtime; cmake/FindOpenMP.cmake picks up
        # this Homebrew libomp. Without it, SWMM_WITH_OPENMP=ON fails configure
        # by design.
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          .\bootstrap-vcpkg${{ matrix.shell_ext }}
          .\vcpkg.exe integrate install

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          ./bootstrap-vcpkg${{ matrix.shell_ext }}
          chmod +x vcpkg

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg downloads (source tarballs)
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-
            vcpkg-downloads-${{ runner.os }}-

      - name: Configure (Release with tests)
        run: >
          cmake
          --preset=${{ matrix.cmake_preset }}-tests
          -B build-${{ matrix.vcpkg_triplet }}
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_osx_arch }}

      - name: Build (Release)
        run: cmake --build build-${{ matrix.vcpkg_triplet }} --config Release

      - name: Unit tests
        run: ctest --test-dir build-${{ matrix.vcpkg_triplet }} -C Release -L unit --output-on-failure

      # ------------------------------------------------------------------
      # OpenMP linkage gate.
      #
      # SWMM_WITH_OPENMP=ON makes find_package(OpenMP REQUIRED) fail configure
      # when no runtime is present, but that does not prove the runtime was
      # actually linked into the binary (a broken generator expression silently
      # dropped it before — see src/solver/CMakeLists.txt). Assert on the
      # produced artifact, not on the CMake variable.
      # ------------------------------------------------------------------
      - name: Verify OpenMP linkage (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          LIB=$(find build-${{ matrix.vcpkg_triplet }} \( -name 'libswmm5.dylib' -o -name 'libswmm5.so' \) | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::swmm5 shared library not found in the build tree"
            exit 1
          fi
          echo "--- $LIB linkage ---"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            otool -L "$LIB"
            otool -L "$LIB" | grep -qi "libomp" || {
              echo "::error::swmm5 is not linked against libomp — the build is silently serial"
              exit 1
            }
          else
            ldd "$LIB"
            ldd "$LIB" | grep -qiE "libgomp|libomp" || {
              echo "::error::swmm5 is not linked against an OpenMP runtime — the build is silently serial"
              exit 1
            }
          fi
          echo "OpenMP runtime linked."

      - name: Verify OpenMP linkage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Recurse -Path "build-${{ matrix.vcpkg_triplet }}" -Filter "swmm5.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lib) {
            Write-Host "::error::swmm5.dll not found in the build tree"
            exit 1
          }
          # MSVC records the OpenMP runtime as an import of vcomp*.dll.
          $strings = & cmd /c "findstr /C:vcomp `"$($lib.FullName)`"" 2>$null
          if (-not $strings) {
            Write-Host "::error::swmm5.dll does not import vcomp (OpenMP) — the build is silently serial"
            exit 1
          }
          Write-Host "OpenMP runtime linked: $($lib.FullName)"

      - name: Smoke run (Example1)
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(find build-${{ matrix.vcpkg_triplet }} -type f \( -name 'runswmm' -o -name 'runswmm.exe' \) | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::runswmm not found in the build tree"
            exit 1
          fi
          mkdir -p smoke
          # tests/outfile/data ships Example1.out only; the .inp lives with the
          # C++ regression data in the main engine repo, so the smoke test just
          # proves the CLI starts and reports usage cleanly when given no args.
          "$EXE" || true
          echo "runswmm invoked: $EXE"

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: swmm-5.2.4-${{ matrix.vcpkg_triplet }}
          path: build-${{ matrix.vcpkg_triplet }}/bin/
          if-no-files-found: ignore
