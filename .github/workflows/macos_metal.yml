name: macOS Apple GPU worker
on:
  pull_request:
    paths:
      - 'cmake/*Metal*'
      - 'src/engine/2d/gpu/**'
      - 'src/engine/2d/solver/**'
      - 'src/engine/core/**'
      - 'src/engine/hydraulics/**'
      - 'src/engine/input/**'
      - 'src/engine/2d/input/**'
      - 'src/engine/2d/data/**'
      - 'include/openswmm/engine/**'
      - 'tests/gpu/check_metal_fv.py'
      - 'tests/gpu/data/fv_device/coupled_chamber.inp'
      - 'src/engine/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'tests/benchmarks/generated/soa_review_2026-10/pipeline_parallel/mixed_water_t1.inp'
      - '.github/workflows/macos_metal.yml'
  push:
    branches: [swmm6_rel, 'feature/macos-metal', 'integration/macos-metal-fv']
    paths:
      - 'cmake/*Metal*'
      - 'src/engine/2d/gpu/**'
      - 'src/engine/2d/solver/**'
      - 'src/engine/core/**'
      - 'src/engine/hydraulics/**'
      - 'src/engine/input/**'
      - 'src/engine/2d/input/**'
      - 'src/engine/2d/data/**'
      - 'include/openswmm/engine/**'
      - 'tests/gpu/check_metal_fv.py'
      - 'tests/gpu/data/fv_device/coupled_chamber.inp'
      - 'src/engine/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'tests/benchmarks/generated/soa_review_2026-10/pipeline_parallel/mixed_water_t1.inp'
      - '.github/workflows/macos_metal.yml'
  workflow_dispatch:
    inputs:
      hardware:
        description: Require a hydraulic run on a registered physical Metal Mac
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.hardware && fromJSON('["self-hosted","macOS","ARM64","metal"]') || 'macos-26' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the pinned fork's Metal toolchain
        if: ${{ !inputs.hardware }}
        run: |
          git init -q "$RUNNER_TEMP/kokkos"
          git -C "$RUNNER_TEMP/kokkos" fetch --depth 1 https://github.com/HydroCouple/kokkos.git "$(cat cmake/KokkosMetalRevision.txt)"
          git -C "$RUNNER_TEMP/kokkos" checkout --detach FETCH_HEAD
          bash "$RUNNER_TEMP/kokkos/.github/scripts/install-macos-acpp.sh" "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/install/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: 2026.07.29
          path: vcpkg
          persist-credentials: false
      - name: Build OpenSWMM and its Metal worker through the macOS preset
        run: |
          export VCPKG_ROOT="$GITHUB_WORKSPACE/vcpkg"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          cmake --preset Darwin-metal -DOPENSWMM_BUILD_UNIT_TESTS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DOPENSWMM_ACPP_EXECUTABLE="$(command -v acpp)" \
            -DOPENSWMM_METAL_SDK="${ACPP_APP_SDK:-$(xcrun --show-sdk-path)}"
          cmake --build --preset Darwin-metal --target openswmm openswmm_gpu_omp --parallel 3
          test -f build/darwin-metal/src/engine/libopenswmm_gpu_omp.dylib
          worker=build/darwin-metal/src/engine/openswmm_metal_faces
          test -x "$worker"
          rc=0
          ACPP_VISIBILITY_MASK=omp "$worker" </dev/null || rc=$?
          test "$rc" -eq 77
      - name: Run the CLI and check strict Metal selection
        shell: bash
        env:
          OPENSWMM_2D_BACKEND: omp
          OMP_NUM_THREADS: 2
          OMP_PROC_BIND: 'false'
          REQUIRE_METAL: ${{ inputs.hardware && '1' || '0' }}
        run: |
          cli="$GITHUB_WORKSPACE/build/darwin-metal/src/cli/openswmm"
          work=$(mktemp -d "$RUNNER_TEMP/metal-faces.XXXXXXXX")
          deck=tests/benchmarks/generated/soa_review_2026-10/pipeline_parallel/mixed_water_t1.inp
          # Exercise the water-only surface section of the mixed water/groundwater mesh.
          awk '/^\[2D_AQUIFER_OPTIONS\]/ {exit} /^MOMENTUM_EQUATION / {$2="LOCAL_INERTIAL"} /^INFILTRATION / {$2="NO"} {print}' "$deck" > "$work/model.inp"
          cp "$deck" "$work/groundwater.inp"
          cd "$work"
          "$cli" model.inp control.rpt control.out
          if ACPP_VISIBILITY_MASK=omp OPENSWMM_2D_METAL_FACES=1 "$cli" model.inp hidden.rpt hidden.out >hidden.log 2>&1; then
            cat hidden.log
            exit 1
          fi
          grep -F 'no Metal GPU available for OpenSWMM face flow' hidden.log
          if OPENSWMM_2D_METAL_FACES=1 "$cli" groundwater.inp groundwater.rpt groundwater.out >groundwater.log 2>&1; then
            exit 1
          fi
          grep -F 'Metal face flow does not support' groundwater.log
          if [ "$REQUIRE_METAL" = 1 ]; then
            OPENSWMM_2D_METAL_FACES=1 "$cli" model.inp metal.rpt metal.out 2>&1 | tee metal.log
            grep -F 'face_operator=metal queue_device=' metal.log
            grep -E 'face_worker_complete sweeps=[1-9][0-9]* evaluations=[1-9][0-9]*' metal.log
          fi
      # The image's python3 is 3.15, for which h5py has no wheel (and the runner no HDF5 to
      # build one against).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check 1D and 2D finite-volume routing and hydraulic results
        shell: bash
        env:
          REQUIRE_METAL: ${{ inputs.hardware && '1' || '0' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/fv-python"
          python="$RUNNER_TEMP/fv-python/bin/python"
          "$python" -m pip install numpy h5py
          export SDKROOT="${ACPP_APP_SDK:-$(xcrun --show-sdk-path)}"
          build="$GITHUB_WORKSPACE/build/darwin-metal"
          engine="$build/src/engine"
          worker="$engine/2d/gpu/metal-build"
          args=(tests/gpu/check_metal_fv.py --cli "$build/src/cli/openswmm" --library "$engine/libopenswmm.engine.dylib")
          "$python" "${args[@]}" --operator metal --plugin-dir "$engine" --hidden-only
          cmake --build "$worker" --target openswmm_faces_cpu_control --parallel 3
          control=$(mktemp -d "$RUNNER_TEMP/fv-control.XXXXXXXX")
          cp "$engine/libopenswmm_gpu_omp.dylib" "$control/"
          cp "$worker/openswmm_faces_cpu_control" "$control/openswmm_metal_faces"
          ACPP_VISIBILITY_MASK=omp "$python" "${args[@]}" --operator sycl-cpu-control --plugin-dir "$control"
          if [ "$REQUIRE_METAL" = 1 ]; then
            "$python" "${args[@]}" --operator metal --plugin-dir "$engine"
          fi
