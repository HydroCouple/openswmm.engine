name: Regression Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  OMP_NUM_THREADS: 1

jobs:
  regression:
    name: "Regression (${{ matrix.alias }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            alias: Linux-x64
            cmake_preset: Linux
            shell_ext: .sh
            vcpkg_triplet: x64-linux
            cmake_osx_arch: ""

          - os: windows-latest
            alias: Windows-x64
            cmake_preset: Windows
            shell_ext: .bat
            vcpkg_triplet: x64-windows
            cmake_osx_arch: "" 
          
          - os: macos-latest
            alias: macOS-arm64
            cmake_preset: Darwin
            shell_ext: .sh
            vcpkg_triplet: arm64-osx
            cmake_osx_arch: arm64

          - os: macos-15-intel
            alias: macOS-x64
            cmake_preset: Darwin
            shell_ext: .sh
            vcpkg_triplet: x64-osx
            cmake_osx_arch: x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: 2025.02.14
          path: vcpkg

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          .\bootstrap-vcpkg${{ matrix.shell_ext }}
          .\vcpkg.exe integrate install

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          ./bootstrap-vcpkg${{ matrix.shell_ext }}
          chmod +x vcpkg

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg downloads (source tarballs)
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-
            vcpkg-downloads-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy

      - name: Configure (Release with tests)
        # The *-tests-release preset sets VCPKG_MANIFEST_FEATURES=tests;geopackage
        # and enables OPENSWMM_BUILD_UNIT_TESTS + OPENSWMM_BUILD_REGRESSION_TESTS
        # + OPENSWMM_WITH_GEOPACKAGE on top of the Release-flavoured base preset.
        run: >
          cmake
          --preset=${{ matrix.cmake_preset }}-tests-release
          -B build-${{ matrix.vcpkg_triplet }}
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_osx_arch }}

      - name: Build (Release)
        run: cmake --build build-${{ matrix.vcpkg_triplet }} --config Release

      - name: Unit tests (sanity check)
        run: ctest --test-dir build-${{ matrix.vcpkg_triplet }} -C Release -L unit --output-on-failure

      # - name: Diagnose Linux unit-test segfaults (gdb)
      #   if: failure() && runner.os == 'Linux'
      #   working-directory: tests/unit/legacy/engine/data
      #   run: |
      #     sudo apt-get install -y gdb
      #     for t in test_solver_api test_solver_errors test_solver_hotstart test_solver_shapes test_solver_expanded_api; do
      #       bin=$(find ${{ github.workspace }}/build-${{ matrix.vcpkg_triplet }} -name "$t" -type f -executable | head -1)
      #       if [ -z "$bin" ]; then echo "Binary $t not found"; continue; fi
      #       echo "==================================================="
      #       echo "==== gdb backtrace: $t"
      #       echo "==================================================="
      #       gdb -batch \
      #         -ex 'set pagination off' \
      #         -ex 'set confirm off' \
      #         -ex 'handle SIGSEGV stop print nopass' \
      #         -ex run \
      #         -ex 'thread apply all bt full' \
      #         -ex quit \
      #         "$bin" 2>&1 | head -400 || true
      #     done

      - name: C++ regression tests
        run: ctest --test-dir build-${{ matrix.vcpkg_triplet }} -C Release -L regression --output-on-failure

      - name: Python regression tests
        working-directory: tests/regression_testing
        env:
          OPENSWMM_BUILD_DIR: ${{ github.workspace }}/build-${{ matrix.vcpkg_triplet }}
        run: python -m pytest -v --tb=short

      - name: Install Release tree
        run: >
          cmake --install build-${{ matrix.vcpkg_triplet }}
          --config Release
          --prefix "${{ github.workspace }}/regression-release-${{ matrix.vcpkg_triplet }}"

      - name: Verify bundled runtime libs (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/regression-release-${{ matrix.vcpkg_triplet }}/bin"
          echo "--- bin/ contents ---"
          ls -la
          echo
          for exe in openswmm openswmm-legacy; do
            [ -x "$exe" ] || continue
            echo "--- $exe linkage ---"
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              otool -L "$exe"
            else
              ldd "$exe"
            fi
          done

      - name: Verify bundled runtime libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}/regression-release-${{ matrix.vcpkg_triplet }}/bin"
          Write-Host "--- bin/ contents ---"
          Get-ChildItem | Format-Table Mode,Length,Name

      - name: Upload Release install artifact
        uses: actions/upload-artifact@v5
        with:
          name: regression-release-${{ matrix.vcpkg_triplet }}
          path: regression-release-${{ matrix.vcpkg_triplet }}/

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: regression-${{ matrix.vcpkg_triplet }}
          path: tests/regression_testing/results/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  #  Python source distribution (sdist) — platform-independent, built once.
  # ──────────────────────────────────────────────────────────────────────
  sdist:
    name: "Python sdist"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist
        working-directory: python
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v5
        with:
          name: python-sdist
          path: python/dist/*.tar.gz
