   <g id="text_13">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(42.236578 262.246882)">Caps — a drain takes at most half the cell's drainable water per step, ½ h_g S_y A / Δt.  A recharge is refused when the table is within 10⁻⁴ z_s of the ground,</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(42.236578 272.425929)">takes at most half the headroom (z_s − h_g) S_y A, and cannot exceed what the node holds for the batch plus what flows through it.</text>
