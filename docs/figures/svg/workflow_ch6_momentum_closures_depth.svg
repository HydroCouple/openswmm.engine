   <g id="text_15">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(50.973125 194.70487)">The three closures share every other part of the marcher: the same mesh, the same time</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(50.973125 204.396962)">stepping, the same coupling. On this cell they disagree by up to 0.46 m and hold that</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(50.973125 214.089055)">disagreement — the closure is not a cosmetic choice. Eight cells under strong boundary</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(50.973125 223.781147)">forcing is a feature demonstration, not a validation: see the analytic cases of Hydraulics 9.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="34.023125" y="7.218516" transform="rotate(-0 34.023125 7.218516)">The same coupled model under the three momentum closures</text>
   </g>
