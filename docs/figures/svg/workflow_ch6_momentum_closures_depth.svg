   <g id="text_16">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(39.749375 306.90111)">The three closures share every other part of the marcher: the same mesh, the same time</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(39.749375 316.593202)">stepping, the same coupling. On this cell they disagree by up to 0.23 m and hold that</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(39.749375 326.285294)">disagreement — the closure is not a cosmetic choice. Eight cells under strong boundary</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(39.749375 335.977386)">forcing is a feature demonstration, not a validation: see the analytic cases of Hydraulics 9.</text>
