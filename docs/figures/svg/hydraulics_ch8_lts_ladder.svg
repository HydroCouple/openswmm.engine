   <g id="text_6">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(433.62 126.474019)">a face between tier 1 and tier 2</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(433.62 135.208313)">fires at the finer cadence and</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(433.62 143.942606)">books ±F Δt into both accumulators</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(433.62 197.754019)">a volume drains its accumulator</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(433.62 206.488313)">when its own window closes:</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(433.62 215.222606)">exact conservation across tiers</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="427.335652" y="250.80675" transform="rotate(-0 427.335652 250.80675)">macro-cycle close: re-tiering allowed</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #898781" x="92.170435" y="250.80675" transform="rotate(-0 92.170435 250.80675)">t</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #898781" x="92.170435" y="14.256" transform="rotate(-0 92.170435 14.256)">Tiers are graded: no face joins volumes more than one tier apart; FV_LTS_MAX_TIERS caps the spread</text>
   </g>
