   <g id="text_1">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(53.679611 59.333553)">tier 0</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(36.363518 68.515759)">Δt = Δt_0</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(53.679611 106.853553)">tier 1</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(28.540205 116.035759)">Δt = 2 Δt_0</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(53.679611 154.373553)">tier 2</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(28.540205 163.555759)">Δt = 4 Δt_0</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(53.679611 201.893553)">tier 3</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(28.540205 211.075759)">Δt = 8 Δt_0</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="259.753043" y="32.3136" transform="rotate(-0 259.753043 32.3136)">one macro cycle = one step of the coarsest tier = 2^3 Δt_0 for 4 tiers</text>
   </g>
