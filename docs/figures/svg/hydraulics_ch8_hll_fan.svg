  <g id="text_20">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #898781" x="3.24" y="246.204775" transform="rotate(-0 3.24 246.204775)">Davis estimates:  S_L = min(v_L − c_L, v_R − c_R),   S_R = max(v_L + c_L, v_R + c_R),   c = √(g A / T)</text>
  </g>
  <g id="text_21">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #898781" x="3.24" y="259.164775" transform="rotate(-0 3.24 259.164775)">Dry right cell:  S_L = v_L − c_L,   S_R = v_L + 2 c_L   (mirror-wise for a dry left cell: v_R − 2 c_R, v_R + c_R)</text>
  </g>
