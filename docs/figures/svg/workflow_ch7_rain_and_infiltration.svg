   <g id="text_24">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(401.715318 22.243792)">The aquifer owns every cell, and each takes in the water</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(401.715318 33.013979)">that reaches it. Cell 0, where the drain draws, never held</text>
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #898781" transform="translate(401.715318 43.023667)">more than 0.0073 mm; the intake ramps off below DRY_DEPTH.</text>
