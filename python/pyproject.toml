# ============================================================================
# OpenSWMM Python Bindings
# ============================================================================
#
# Build backend: scikit-build-core (CMake + Cython integration).
#
#   pip install .                            # release install (clean wheel)
#   pip install -e . --no-build-isolation    # editable dev install
#   DEBUG=1 pip install .                    # debug build
#   python -m build                          # build sdist + wheel locally
#   cibuildwheel                             # cross-platform wheels in CI
#
# Environment variables honoured by the build:
#   VCPKG_ROOT          - path to vcpkg checkout (toolchain auto-loaded if set)
#   CMAKE_ARGS          - extra -D flags forwarded to every configure
#   SKBUILD_CMAKE_ARGS  - scikit-build-core's own override channel
#   DEBUG=1             - switch CMAKE_BUILD_TYPE to Debug
#   OPENSWMM_ENGINE_INSTALL_PREFIX - link against a pre-built engine instead
#                                    of building it from source (CI hot-path)
#
# Conda environments work the same as any other venv: the wheel is fully
# self-contained, dylibs/DLLs ship inside the package, and conda's libs are
# not relied on at runtime.
# ============================================================================

[build-system]
# Build-time NumPy floor matches the runtime [project].dependencies floor
# (numpy >= 1.21).  We deliberately do NOT cap below 2.0: at CMake configure
# time we materialise a patched copy of numpy's bundled Cython pxd into the
# build tree to fix an upstream bug in numpy 2.x's
# `__init__.cython-30.pxd` that references the removed `_PyArray_Descr.subarray`
# field — see python/cmake/PatchNumpyPxd.cmake.  With the patch in place,
# extensions compile against numpy 2.x and the produced wheels run on any
# numpy >= 1.21 (since we use only the numpy 1.7+ stable ABI surface).
requires = [
    "scikit-build-core >= 0.10",
    "cython >= 3.0.12",
    "numpy >= 1.21",
]
build-backend = "scikit_build_core.build"

# ============================================================================
# Project metadata  (PEP 621)
# ============================================================================
[project]
name = "openswmm"
version = "6.0.0a2"
description = "Python bindings for the OpenSWMM stormwater modelling engine."
requires-python = ">=3.10"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors     = [{ name = "Caleb Buahin", email = "caleb.buahin@gmail.com" }]
maintainers = [{ name = "Caleb Buahin", email = "caleb.buahin@gmail.com" }]
keywords = [
    "SWMM",
    "stormwater",
    "hydrology",
    "hydraulics",
    "water resources",
    "environmental engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy >= 1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.3",
    "cython >= 3.0.12",
    "build >= 1.2",
]

[project.urls]
Homepage      = "https://github.com/hydrocouple/openswmm.engine/python"
Repository    = "https://github.com/hydrocouple/openswmm.engine"
"Bug Tracker" = "https://github.com/hydrocouple/openswmm.engine/issues"
Changelog     = "https://github.com/hydrocouple/openswmm.engine/blob/main/CHANGELOG.md"

# ============================================================================
# scikit-build-core configuration
# ============================================================================
[tool.scikit-build]
minimum-version  = "build-system.requires"
cmake.version    = ">=3.24"
cmake.build-type = "Release"
ninja.make-fallback = true

# Per-tag build directory.  Keeps editable, debug, and release wheel
# builds from clobbering each other's CMake cache and prevents the
# "stale .so picked up from previous Python ABI" class of bugs.
build-dir = "build/{wheel_tag}"

# Where the package lives on disk.  scikit-build-core copies the package
# tree AND CMake install() outputs into the wheel.
wheel.packages = ["openswmm"]

# What stays out of the binary wheel.  Cython sources and generated .c
# files are huge and never needed at runtime; .pxd headers stay so that
# downstream Cython modules can `cimport openswmm.engine`.
wheel.exclude = [
    "**/*.pyx",
    "**/*.c",
    "**/*.cxx",
    "**/__pycache__/**",
    "**/.DS_Store",
]

# Editable install:
#   - mode=redirect keeps the source tree as the import location while
#     CMake-built outputs are surfaced via a finder placed in
#     site-packages.
#   - rebuild=false is intentional.  scikit-build-core's auto-rebuild
#     mode is incompatible with build isolation: pip's ephemeral
#     build env (containing cmake/ninja) is deleted after the install
#     completes, but the auto-rebuild hook keeps trying to invoke
#     those binaries on every import — failing with
#     "/private/var/folders/.../pip-build-env-XXXX/.../cmake: No such
#     file or directory".  It's also genuinely too slow for this
#     project (entire C++ engine + 21 Cython modules per rebuild).
#
# To pick up changes to a .pyx after the initial install, just re-run:
#     pip install -e . --no-build-isolation
# (--no-build-isolation reuses the venv's cmake / ninja / cython, so
# no temporary path gets baked into build.ninja.)
editable.mode    = "redirect"
editable.rebuild = false
editable.verbose = false

# sdist: include everything needed to build from scratch on a clean
# machine, but exclude all build artefacts.
sdist.include = [
    "openswmm/**/*.pyi",
    "openswmm/**/*.pxd",
    "openswmm/legacy/**/*.c",
    "tests/data/**/*",
    "CMakePresets.json",
]
sdist.exclude = [
    "**/.idea/**",
    "**/.vscode/**",
    "**/.pytest_cache/**",
    "**/__pycache__/**",
    "_skbuild/**",
    "build/**",
    "dist/**",
    "wheelhouse/**",
    "openswmm.egg-info/**",
    "**/*.so",
    "**/*.dylib",
    "**/*.dll",
    "**/*.pyd",
    "**/.DS_Store",
]

# ----------------------------------------------------------------------------
# Conditional overrides driven by environment variables.
# if.env values are regex patterns; ".+" matches any non-empty string.
# ----------------------------------------------------------------------------

# DEBUG=1 → debug build.
[[tool.scikit-build.overrides]]
if.env.DEBUG = "1"
cmake.build-type = "Debug"

# Note: VCPKG_ROOT, OPENSWMM_ENGINE_INSTALL_PREFIX, and CMAKE_OSX_ARCHITECTURES
# are read directly by CMakeLists.txt via $ENV{}.  Pass extra CMake flags via
# the CMAKE_ARGS or SKBUILD_CMAKE_ARGS environment variables:
#
#   export CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
#   pip install -e . --no-build-isolation

# ============================================================================
# cibuildwheel  (release-wheel matrix)
# ============================================================================
# See docs/CIBUILDWHEEL_REVERT_PLAN.md for the rationale behind each setting.
#
# Linux: vcpkg is git-cloned and bootstrapped INSIDE the manylinux container
# via `before-all`. The vcpkg GHA binary cache (x-gha) is reused across runs
# so SUNDIALS / HDF5 / etc. are not rebuilt every time. The workflow forwards
# ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN into the container so x-gha works.
# macOS / Windows: no container; vcpkg lives on the host runner and
# VCPKG_ROOT is exported by the workflow.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
# musllinux IS built (Alpine users); win32 / i686 / free-threaded are skipped.
skip  = "*-win32 *-manylinux_i686 cp3??t-*"
archs = "native"
build-verbosity = 1

# Modern glibc baseline (RHEL 9 / Ubuntu 20.04+ / Debian 11+).
manylinux-x86_64-image  = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# musllinux baseline (Alpine 3.x). The linux before-all installs build deps via
# apk on these images (see the apk branch below).
musllinux-x86_64-image  = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"

test-requires = ["pytest", "numpy"]
test-command  = "pytest {package}/tests/engine -v --import-mode=importlib --ignore={package}/tests/engine/test_integration.py"

[tool.cibuildwheel.linux]
# Bootstrap vcpkg inside the manylinux container. The host's $VCPKG_ROOT is
# not visible here (this is what broke the previous cibuildwheel attempt).
#
# Triplet naming: vcpkg uses x64/arm64, not uname -m's x86_64/aarch64.
# Mapping is done explicitly to avoid silently picking the wrong triplet
# if vcpkg ever adds e.g. an x86_64-linux community alias.
before-all = """
set -euo pipefail
# Install build deps for whichever base image we're on: Alpine (musllinux, apk),
# AlmaLinux/manylinux_2_28 (yum/dnf), or Debian-based (apt).
if command -v apk >/dev/null 2>&1; then
  apk add --no-cache curl zip unzip tar git ninja samurai build-base linux-headers bash
elif command -v yum >/dev/null 2>&1; then
  yum install -y curl zip unzip tar git ninja-build libgomp
else
  apt-get update && apt-get install -y curl zip unzip tar git ninja-build libgomp1
fi

# Pin CMake < 4 inside the container, ahead of the system cmake.
# Why: manylinux_2_28_aarch64:2025.08.15-1 ships CMake 4.x. vcpkg-tool's
# bundled cmakerc dep has cmake_minimum_required(VERSION 3.3), which CMake
# 4.x rejects with "Compatibility with CMake < 3.5 has been removed". On
# x86_64, bootstrap-vcpkg.sh downloads a pre-built binary and skips this
# CMake compile entirely — the bug only fires on arm64. We apply the pin
# unconditionally so the same fix protects any vcpkg port (SUNDIALS, HDF5,
# ...) that might hit the same compatibility removal on either arch.
# Belt-and-suspenders: CMAKE_POLICY_VERSION_MINIMUM=3.5 (set in `environment`
# below, so it persists into the build phase) makes any CMake 4.x that still
# gets invoked accept the < 3.5 minimum instead of failing.
/opt/python/cp312-cp312/bin/pip install --quiet 'cmake<4'
export PATH="/opt/python/cp312-cp312/bin:$PATH"

case "$(uname -m)" in
  x86_64)  VCPKG_TRIPLET=x64-linux ;;
  aarch64) VCPKG_TRIPLET=arm64-linux ;;
  *)       echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
esac
# /host persists across the manylinux and musllinux container runs within a
# single cibuildwheel invocation, so a checkout from the earlier (manylinux)
# run may already be at /host/vcpkg — and a bare `git clone` aborts on a
# non-empty destination ("destination path already exists"). The vcpkg tool
# binary is also libc-specific (a glibc binary bootstrapped under manylinux
# cannot exec under musllinux), so the checkout must be re-cloned and
# re-bootstrapped per container rather than reused. Wipe any stale checkout
# first, preserving the (cache-restored) downloads/ tree so source tarballs are
# not re-fetched.
if [ -d /host/vcpkg ]; then
  rm -rf /tmp/vcpkg-downloads
  mv /host/vcpkg/downloads /tmp/vcpkg-downloads 2>/dev/null || true
  rm -rf /host/vcpkg
fi
git clone --depth 1 --branch "${VCPKG_REF:-2025.02.14}" https://github.com/microsoft/vcpkg.git /host/vcpkg
if [ -d /tmp/vcpkg-downloads ]; then
  rm -rf /host/vcpkg/downloads
  mv /tmp/vcpkg-downloads /host/vcpkg/downloads
fi
/host/vcpkg/bootstrap-vcpkg.sh -disableMetrics
# CPU-only base wheel: opt out of vcpkg default-features so the now-default `gpu`
# feature (Kokkos + sundials[kokkos]) is NOT built/linked here. Mirrors the
# CMake-side opt-out in python/CMakeLists.txt; keeps this wheel Kokkos-free and
# portable. OpenMP acceleration ships via the openswmm-gpu-omp companion wheel.
# `hypre` IS pulled here so PRECONDITIONER=AMG (the 2D solver default) works in
# the wheel via the serial BoomerAMG preconditioner — must mirror the `2d;hypre`
# feature list in python/CMakeLists.txt (OPENSWMM_WITH_HYPRE defaults ON).
/host/vcpkg/vcpkg install \
  --triplet "$VCPKG_TRIPLET" \
  --x-manifest-root /project \
  --x-install-root /host/vcpkg/installed \
  --x-no-default-features \
  --x-feature 2d \
  --x-feature hypre
"""
before-build = "pip install ninja"
environment  = { VCPKG_ROOT = "/host/vcpkg", CMAKE_POLICY_VERSION_MINIMUM = "3.5" }
# Forward GHA cache creds + vcpkg binary cache config + the vcpkg ref pin into
# the container.
environment-pass = ["ACTIONS_CACHE_URL", "ACTIONS_RUNTIME_TOKEN", "VCPKG_BINARY_SOURCES", "VCPKG_REF"]

[tool.cibuildwheel.macos]
# OpenMP on macOS:
#   - Apple's clang ships without libomp. Homebrew's libomp bottle on the
#     macos-15 runners has min-target 15.0, and delocate refuses to bundle a
#     dylib whose minimum exceeds the wheel target. So instead of `brew install
#     libomp`, we BUILD libomp from LLVM source at the wheel's deployment
#     target (11.0) and install it into the Homebrew opt prefix — see
#     scripts/build_macos_libomp.sh. This lets us ship wheels for macOS 11+.
#   - python/CMakeLists.txt include()s the parent's ../cmake/FindOpenMP.cmake,
#     which probes BOTH Homebrew prefixes (/opt/homebrew/opt/libomp on Apple
#     Silicon, /usr/local/opt/libomp on Intel) — exactly where the script
#     installs — and creates OpenMP::OpenMP_C/CXX INTERFACE imports.
#   - delocate-wheel bundles that libomp.dylib INTO the wheel and rewrites
#     @rpath, so end users never need brew at runtime.
# (cibuildwheel runs before-all from the repo root, so the script path is
#  scripts/…, matching how the Windows repair script is referenced.)
before-all   = "brew install ninja && bash scripts/build_macos_libomp.sh"
before-build = "pip install delocate"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
# Deployment target 11.0 (Big Sur). libomp is built to match (above), so
# delocate can bundle it. Lowering further would require an even older libomp.
environment  = { VCPKG_ROOT = "$VCPKG_ROOT", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
# Custom repair: delvewheel's default search (PATH only) misses both
# openswmm.engine.dll (installed inside the wheel at openswmm/engine/)
# and the vcpkg-provided runtime DLLs (SUNDIALS, HDF5, …). The helper
# script extracts the wheel, collects every DLL subdirectory, adds
# $VCPKG_ROOT/installed/x64-windows/bin, and passes them as --add-path.
repair-wheel-command = "python python/scripts/cibw_repair_windows.py {wheel} {dest_dir}"
environment  = { VCPKG_ROOT = "$VCPKG_ROOT" }

# ============================================================================
# pytest
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
markers   = [
    "slow: tests that take more than ~1s of wall time (concurrent-simulation, perf checks). Skip with -m 'not slow'.",
]

# ============================================================================
# mypy  (Pythonic v1 bindings)
# ============================================================================
# v1 ships with hand-maintained .pyi stubs for every Cython extension.
# We run a default-mode check across openswmm.engine plus a narrower
# strict-mode pass on the pure-Python modules. The full strict-mode
# gate lands alongside the legacy test-suite migration (see
# docs/PYTHONIC_BINDINGS_PLAN.md §6 P9 deferred items).
[tool.mypy]
python_version         = "3.10"
files                  = ["openswmm/engine"]
ignore_missing_imports = true
check_untyped_defs     = true
disallow_untyped_defs  = false
warn_redundant_casts   = true
warn_unused_ignores    = true

[[tool.mypy.overrides]]
module = [
    "openswmm.engine._enums",
    "openswmm.engine._exceptions",
    "openswmm.engine._dates",
]
strict = true
