# ============================================================================
# openswmm-gpu-omp  —  OpenMP (Kokkos) acceleration companion for OpenSWMM 2D
# ============================================================================
#
# Ships ONE native plugin (libopenswmm_gpu_omp) and a tiny import package. The
# base `openswmm` wheel stays CPU-only/portable; installing THIS wheel alongside
# it makes 2D surface runs use the Kokkos-OpenMP solver automatically (the base
# package's import-time discovery shim adds this package to the engine's plugin
# search path). Uninstalling reverts to the serial CPU solver.
#
# Build backend: scikit-build-core. The CMakeLists reuses the engine's real
# plugin CMake (src/engine/2d/gpu, omp backend) — see CMakeLists.txt.
#
#   pip install .                         # build the companion (needs VCPKG_ROOT)
#   cibuildwheel                          # cross-platform wheels in CI
# ============================================================================

[build-system]
requires = ["scikit-build-core >= 0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "openswmm-gpu-omp"
version = "6.0.0a3"
description = "OpenMP (Kokkos) GPU-plugin companion for the OpenSWMM 2D surface solver."
requires-python = ">=3.10"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "../../LICENSE" }
authors     = [{ name = "Caleb Buahin", email = "caleb.buahin@gmail.com" }]
maintainers = [{ name = "Caleb Buahin", email = "caleb.buahin@gmail.com" }]
keywords = ["SWMM", "stormwater", "hydraulics", "GPU", "OpenMP", "Kokkos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Hydrology",
]
# Runtime version-locked to the base package: the plugin and the engine share
# the GpuPluginAbi C ABI, and the loader additionally enforces the ABI version
# at dlopen() time (GpuPluginAbi.h OPENSWMM_GPU_ABI_VERSION).
dependencies = ["openswmm == 6.0.0a3"]

[project.urls]
Homepage   = "https://github.com/hydrocouple/openswmm.engine"
Repository = "https://github.com/hydrocouple/openswmm.engine"

# ============================================================================
# scikit-build-core
# ============================================================================
[tool.scikit-build]
minimum-version  = "build-system.requires"
cmake.version    = ">=3.24"
cmake.build-type = "Release"
ninja.make-fallback = true
build-dir = "build/{wheel_tag}"

# The import package lives here; CMake install() drops the plugin .so into it.
wheel.packages = ["openswmm_gpu_omp"]
wheel.exclude  = ["**/__pycache__/**", "**/.DS_Store"]

# No Cython/Python extension modules are compiled — only a plain shared library —
# so the wheel is ABI-agnostic across CPython 3.x; tag it py3 (one wheel per
# platform instead of one per interpreter).
wheel.py-api = "py3"

# ============================================================================
# cibuildwheel  (mirrors python/pyproject.toml; builds the `gpu` feature)
# ============================================================================
# NOTE: the per-interpreter `build` list still drives cibuildwheel, but with
# wheel.py-api = "py3" each platform collapses to a single py3-none wheel.
[tool.cibuildwheel]
build = "cp312-*"            # one interpreter is enough: output is py3-none-<plat>
skip  = "*-win32 *-manylinux_i686 cp3??t-*"
archs = "native"
build-verbosity = 1

manylinux-x86_64-image  = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image  = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"

# Test phase is intentionally disabled: a meaningful smoke test imports the base
# `openswmm` package (to exercise the discovery shim), which is not installable
# from PyPI at companion-build time (chicken-and-egg on an unpublished release).
# The plugin itself is covered by the engine's own ctest (test_engine_2d_omp_default)
# and the end-to-end fresh-venv check in docs/2D_GPU_DEFAULTS.md.
test-skip = "*"

[tool.cibuildwheel.linux]
# Bootstrap vcpkg inside the manylinux/musllinux container and pre-install the
# engine manifest's `gpu` feature only (Kokkos + sundials[kokkos]); no default
# features. cibuildwheel mounts the repo root at /project (the engine vcpkg.json
# + overlays live there); this package is built from /project/packages/gpu-omp.
before-all = """
set -euo pipefail
if command -v apk >/dev/null 2>&1; then
  apk add --no-cache curl zip unzip tar git ninja samurai build-base linux-headers bash
elif command -v yum >/dev/null 2>&1; then
  yum install -y curl zip unzip tar git ninja-build libgomp
else
  apt-get update && apt-get install -y curl zip unzip tar git ninja-build libgomp1
fi

# Pin CMake < 4 (same rationale as the base wheel: vcpkg-tool's bundled cmakerc
# dep rejects CMake 4.x on arm64).
/opt/python/cp312-cp312/bin/pip install --quiet 'cmake<4'
export PATH="/opt/python/cp312-cp312/bin:$PATH"

case "$(uname -m)" in
  x86_64)  VCPKG_TRIPLET=x64-linux ;;
  aarch64) VCPKG_TRIPLET=arm64-linux ;;
  *)       echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
esac
# Make vcpkg use the SYSTEM cmake/ninja instead of the prebuilt tools it keeps
# in downloads/tools. Those bundled binaries are glibc-linked; on musllinux
# (Alpine) they cannot exec, so vcpkg's compiler-hash detection dies the instant
# it invokes the downloaded ninja. The system tools are installed above (apk
# ninja/samurai, yum/apt ninja-build) with the pinned cmake<4 on PATH. No-op on
# manylinux (glibc), where the same system tools are valid too.
export VCPKG_FORCE_SYSTEM_BINARIES=1
# /host persists across the manylinux and musllinux container runs within a
# single cibuildwheel invocation, so a checkout from the earlier (manylinux)
# run may already be at /host/vcpkg — and a bare `git clone` aborts on a
# non-empty destination ("destination path already exists"). The vcpkg tool
# binary is also libc-specific (a glibc binary bootstrapped under manylinux
# cannot exec under musllinux), so the checkout must be re-cloned and
# re-bootstrapped per container rather than reused. Wipe any stale checkout
# first, preserving the (cache-restored) downloads/ tree so source tarballs are
# not re-fetched.
if [ -d /host/vcpkg ]; then
  rm -rf /tmp/vcpkg-downloads
  mv /host/vcpkg/downloads /tmp/vcpkg-downloads 2>/dev/null || true
  rm -rf /host/vcpkg
fi
git clone --depth 1 --branch "${VCPKG_REF:-2025.02.14}" https://github.com/microsoft/vcpkg.git /host/vcpkg
if [ -d /tmp/vcpkg-downloads ]; then
  rm -rf /host/vcpkg/downloads
  mv /tmp/vcpkg-downloads /host/vcpkg/downloads
fi
/host/vcpkg/bootstrap-vcpkg.sh -disableMetrics
/host/vcpkg/vcpkg install \
  --triplet "$VCPKG_TRIPLET" \
  --x-manifest-root /project \
  --x-install-root /host/vcpkg/installed \
  --x-no-default-features \
  --x-feature gpu \
  --x-feature hypre
"""
before-build = "pip install ninja"
environment  = { VCPKG_ROOT = "/host/vcpkg", CMAKE_POLICY_VERSION_MINIMUM = "3.5", VCPKG_FORCE_SYSTEM_BINARIES = "1" }
environment-pass = ["ACTIONS_CACHE_URL", "ACTIONS_RUNTIME_TOKEN", "VCPKG_BINARY_SOURCES", "VCPKG_REF"]

[tool.cibuildwheel.macos]
# Build libomp at the wheel's deployment target so delocate can bundle it (same
# as the base wheel — Kokkos' OpenMP backend links libomp; Kokkos itself is a
# static lib so nothing else needs vendoring).
before-all   = "brew install ninja && bash scripts/build_macos_libomp.sh"
before-build = "pip install delocate"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
environment  = { VCPKG_ROOT = "$VCPKG_ROOT", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
before-build = "pip install delvewheel"
# Vendor the plugin's runtime DLLs (libomp, any vcpkg runtime) into the package.
# Kokkos is static; the main dependency to bundle is the OpenMP runtime.
repair-wheel-command = "delvewheel repair --add-path %VCPKG_ROOT%\\installed\\x64-windows\\bin -w {dest_dir} {wheel}"
environment  = { VCPKG_ROOT = "$VCPKG_ROOT" }
